<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<style>
  :root { --ink: #2b2a33; --text: #f6efe6; --muted: #c9dbe8; --peach: #f4a07a; --gold: #ffd166; --red: #ff6b81; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e3558; color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  .hidden { display: none !important; }
  #sea { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* балонче с говор */
  #bubble { position: fixed; left: 0; top: 0; transform: translate(-50%, -100%); pointer-events: none;
    background: #fffaf2; color: #2a1730; border: 3px solid var(--ink); border-radius: 18px; padding: 6px 14px 8px;
    text-align: center; max-width: min(280px, 80vw); box-shadow: 0 4px 0 rgba(0,0,0,.25); transition: opacity .2s; z-index: 3; }
  #bubble::after { content: ""; position: absolute; left: 50%; bottom: -12px; margin-left: -9px; width: 16px; height: 16px;
    background: #fffaf2; border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); transform: rotate(45deg); }
  #bubble .e { font-size: 26px; line-height: 1.15; }
  #bubble .t { font-size: 13px; line-height: 1.3; white-space: pre-line; }
  #handle { position: fixed; left: 50%; bottom: max(8px, env(safe-area-inset-bottom)); width: 120px; margin-left: -60px; height: 26px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 2; }
  #handle::before { content: ""; width: 54px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.75); box-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .todo { list-style: none; margin: 4px 0 12px; padding: 0; }
  .todo li { padding: 3px 0; font-size: 14px; }
  .todo li.done { color: var(--muted); text-decoration: line-through; }
  #bubble.want { background: #fff3c4; animation: pulse 1.2s infinite; }
  #bubble.want::after { background: #fff3c4; }
  @keyframes pulse { 50% { transform: translate(-50%, -100%) scale(1.06); } }

  /* менюто около него */
  .rb { position: fixed; left: 0; top: 0; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%;
    background: rgba(255,250,242,.95); border: 3px solid var(--ink); box-shadow: 0 4px 0 rgba(0,0,0,.28);
    font-size: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
    transform: scale(0); opacity: 0; transition: transform .2s cubic-bezier(.3,1.6,.6,1), opacity .15s; z-index: 4; }
  .rb.open { transform: scale(1); opacity: 1; }
  .rb:active { transform: scale(.9); }
  .rb small { position: absolute; top: 100%; margin-top: 5px; left: 50%; transform: translateX(-50%); white-space: nowrap;
    font-size: 11px; font-weight: 700; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.8); pointer-events: none; }
  .rb.want { background: var(--gold); animation: wig .5s infinite; }
  @keyframes wig { 25% { rotate: -8deg; } 75% { rotate: 8deg; } }

  #top { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; font-size: 13px;
    color: #eaf6ff; text-shadow: 0 1px 3px rgba(0,0,0,.6); pointer-events: none; z-index: 2; }
  #hint { position: fixed; bottom: calc(max(8px, env(safe-area-inset-bottom)) + 36px); left: 0; right: 0; text-align: center; font-size: 14px;
    color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.7); pointer-events: none; animation: fade 2.4s infinite; z-index: 2; }
  @keyframes fade { 50% { opacity: .45; } }

  /* панел отдолу (работилница, как е, дневник) */
  #scrim { position: fixed; inset: 0; z-index: 5; }
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 560px; max-height: 72vh; overflow-y: auto;
    background: rgba(18,40,68,.9); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 3px solid var(--ink); border-bottom: 0; border-radius: 24px 24px 0 0; z-index: 6;
    padding: 14px 16px max(18px, env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .25s ease; }
  #sheet.open { transform: translateY(0); }
  #sheet h2 { font-size: 17px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; }
  #sheet h2 span { color: var(--muted); font-size: 13px; font-weight: 500; }
  .x { background: none; border: 0; color: var(--muted); font-size: 22px; cursor: pointer; padding: 0 4px; }
  button { font: inherit; color: var(--text); background: rgba(255,255,255,.12); border: 0; border-radius: 12px; padding: 10px; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  .bench { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 8px; align-items: center; margin-bottom: 12px; }
  .slot { height: 62px; border: 2px dashed rgba(255,255,255,.35); border-radius: 14px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-size: 28px; cursor: pointer; }
  .slot small { font-size: 11px; color: var(--muted); }
  .slot.full { border-style: solid; border-color: var(--peach); }
  .plus { font-size: 22px; color: var(--muted); }
  .try { background: var(--peach); color: #2a1730; font-weight: 700; padding: 12px 14px; }
  .inv { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; }
  .inv button { display: flex; flex-direction: column; align-items: center; padding: 8px 4px; gap: 2px; }
  .inv button span { font-size: 26px; line-height: 1.1; }
  .inv button small { font-size: 11px; color: var(--muted); line-height: 1.15; text-align: center; }
  .inv button.new { box-shadow: 0 0 0 2px var(--gold) inset; }
  .inv button.wanted { box-shadow: 0 0 0 3px var(--gold) inset; animation: wig .6s infinite; }
  .bars { display: grid; gap: 8px; }
  .bar { display: grid; grid-template-columns: 26px 1fr 34px; align-items: center; gap: 8px; font-size: 13px; }
  .bar .ic { font-size: 17px; text-align: center; }
  .track { height: 10px; background: rgba(0,0,0,.35); border-radius: 6px; overflow: hidden; }
  .fill { height: 100%; border-radius: 6px; }
  .bar b { text-align: right; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; margin: 10px 0; }
  .journal { list-style: none; margin: 0; padding: 0; }
  .journal li { padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,.12); font-size: 14px; }
  .journal li time { color: var(--muted); font-size: 12px; margin-right: 6px; }

  /* вход */
  .center { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding-bottom: max(8vh, env(safe-area-inset-bottom)); z-index: 7; text-align: center; }
  .center h1 { margin: 0; font-size: 30px; text-shadow: 0 2px 0 var(--ink), 0 0 12px rgba(0,0,0,.4); }
  .center p { margin: 2px 0 14px; color: #eaf6ff; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  .center form { display: grid; gap: 10px; width: min(300px, 86vw); }
  .center input { font: inherit; font-size: 16px; padding: 12px; border-radius: 14px; border: 3px solid var(--ink);
    background: rgba(255,250,242,.95); color: #2a1730; text-align: center; -webkit-user-select: text; user-select: text; }
  .center form button { background: var(--peach); color: #2a1730; font-weight: 800; padding: 12px; border: 3px solid var(--ink); border-radius: 14px; }
  .err { color: #ffd0d8; font-size: 14px; min-height: 20px; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
</style>
</head>
<body>
<canvas id="sea"></canvas>
<div id="top"></div>
<div id="ver" style="position:fixed;right:8px;bottom:max(6px,env(safe-area-inset-bottom));font-size:10px;color:rgba(255,255,255,.55);z-index:2;pointer-events:none"></div>
<div id="hint" class="hidden">Докосни Октонис 🐙</div>
<div id="handle" class="hidden" title="Как е"></div>
<div id="bubble" class="hidden"><div class="e" id="bubbleE"></div><div class="t" id="bubbleT"></div></div>
<div id="ring"></div>

<div id="scrim" class="hidden"></div>
<div id="sheet"></div>

<div id="loginView" class="center hidden">
  <h1>Октонис</h1>
  <p>малкият изобретател</p>
  <form id="loginForm">
    <input id="nick" placeholder="ник" autocomplete="username" autocapitalize="off" spellcheck="false">
    <input id="pass" type="password" placeholder="парола" autocomplete="current-password">
    <button type="submit" id="loginBtn">Влез</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>
<div id="loadView" class="center"><p>Зареждане… 🫧</p></div>

<script>document.write('<script src="octo.js?t=' + Date.now() + '"><\/script>')</script>
<script type="module">
// ---------- Firebase ----------
const firebaseConfig = {
  apiKey: "AIzaSyDOfWyvQ3jN1edYKrsTyVoDPIEqbNagQqg",
  authDomain: "oktonis.firebaseapp.com",
  projectId: "oktonis",
  storageBucket: "oktonis.firebasestorage.app",
  messagingSenderId: "136604700606",
  appId: "1:136604700606:web:ba336dfe2c9f8e8c5ab3ef"
};
const KEEPER = "toshik";                    // грижи се; останалите само гледат
const DEMO = new URLSearchParams(location.search).has("demo");

let fb = null;
if (!DEMO) {
  const V = "10.12.2", G = `https://www.gstatic.com/firebasejs/${V}/`;
  let mods;
  try {
    mods = await Promise.all([import(G + "firebase-app.js"), import(G + "firebase-auth.js"), import(G + "firebase-firestore.js")]);
  } catch (e) {
    document.getElementById("loadView").innerHTML = "<p>Няма връзка с интернет 📡<br>Опитай пак след малко.</p>";
    throw e;
  }
  const [appM, authM, fsM] = mods;
  const app = appM.initializeApp(firebaseConfig);
  fb = { auth: authM.getAuth(app), db: fsM.getFirestore(app), A: authM, F: fsM };
  authM.setPersistence(fb.auth, authM.browserLocalPersistence).catch(() => {});   // помни входа
}

// ---------- Изобретения ----------
const E = {
  tok: ["⚡", "Ток"], metal: ["🔩", "Метал"], voda: ["💧", "Вода"], ogan: ["🔥", "Огън"], vazduh: ["💨", "Въздух"],
  zica: ["🔌", "Жица"], gear: ["⚙️", "Зъбно колело"], para: ["♨️", "Пара"], verig: ["🔗", "Верига"], perka: ["🌀", "Перка"],
  bat: ["🔋", "Батерия"], magnit: ["🧲", "Магнит"], kruska: ["💡", "Крушка"], vzriv: ["💥", "Взрив"], oblak: ["☁️", "Облак"],
  burq: ["🌩️", "Буря"], vent: ["🌬️", "Вентилатор"], parna: ["🚂", "Парна машина"], chas: ["⏰", "Часовник"], kompas: ["🧭", "Компас"],
  fener: ["🔦", "Фенерче"], antena: ["📡", "Антена"], radio: ["📻", "Радио"], tv: ["📺", "Телевизор"], chip: ["💾", "Чип"],
  tel: ["📱", "Телефон"], komp: ["💻", "Компютър"], net: ["🌐", "Интернет"], ruka: ["🦾", "Робо-ръка"], robot: ["🤖", "Робот"],
  dron: ["🚁", "Дрон"], kolelo: ["🚲", "Колело"], kola: ["🚗", "Кола"], raketa: ["🚀", "Ракета"], satelit: ["🛰️", "Сателит"],
  led: ["🧊", "Лед"], muz: ["🎶", "Музикална кутия"], printer: ["🖨️", "Принтер"], konzola: ["🕹️", "Конзола"], gram: ["🗼", "Гръмоотвод"],
  svetof: ["🚦", "Светофар"], kamera: ["📷", "Фотоапарат"], chat: ["💬", "Чат"], um: ["🧠", "Изкуствен ум"], robokt: ["🐙", "Робо-Октонис"],
};
const BASE = ["tok", "metal", "voda", "ogan", "vazduh"];
const RECIPES = [
  ["tok", "metal", "zica"], ["zica", "metal", "magnit"], ["zica", "ogan", "kruska"], ["tok", "tok", "bat"],
  ["ogan", "voda", "para"], ["ogan", "metal", "gear"], ["metal", "metal", "verig"], ["vazduh", "metal", "perka"],
  ["ogan", "vazduh", "vzriv"], ["voda", "vazduh", "oblak"], ["oblak", "tok", "burq"], ["perka", "tok", "vent"],
  ["para", "gear", "parna"], ["gear", "gear", "chas"], ["magnit", "voda", "kompas"], ["kruska", "bat", "fener"],
  ["zica", "zica", "antena"], ["antena", "tok", "radio"], ["radio", "kruska", "tv"], ["zica", "chas", "chip"],
  ["radio", "chip", "tel"], ["chip", "tv", "komp"], ["komp", "antena", "net"], ["chip", "metal", "ruka"],
  ["ruka", "bat", "robot"], ["perka", "chip", "dron"], ["verig", "gear", "kolelo"], ["kolelo", "parna", "kola"],
  ["kola", "vzriv", "raketa"], ["raketa", "antena", "satelit"], ["voda", "vent", "led"], ["chas", "radio", "muz"],
  ["komp", "ruka", "printer"], ["komp", "tv", "konzola"], ["burq", "verig", "gram"], ["kruska", "chas", "svetof"],
  ["tel", "kruska", "kamera"], ["tel", "net", "chat"], ["robot", "komp", "um"], ["robot", "voda", "robokt"],
];
const key = (a, b) => [a, b].sort().join("+");
const RECIPE = Object.fromEntries(RECIPES.map(([a, b, c]) => [key(a, b), c]));
const name = id => E[id][0] + " " + E[id][1];

// ---------- Състояние ----------
const MIN = 60000;
let S = null;              // състоянието на Октонис
let role = "keeper";       // keeper | viewer
let session = Math.random().toString(36).slice(2);
let dirty = false, lastSave = 0;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));

function fresh(now) {
  return {
    v: 1, t: now, born: now, hunger: 20, energy: 85, mood: 70, health: 100, mess: 0, skill: 0,
    asleep: false, hurt: 0, known: [...BASE], fresh: [], want: null, nextWant: now + 2 * MIN,
    lastHint: 0, lastWin: 0, lastCare: now, meals: [], lastMeal: now, lastGrumble: 0, todo: null, journal: [{ t: now, x: "🥚 Октонис се излюпи! Обича технологиите." }],
  };
}
function log(x, t = Date.now()) {
  S.journal.unshift({ t, x });
  S.journal.length = Math.min(S.journal.length, 60);
}
function candidates() {
  return RECIPES.filter(([a, b, c]) => S.known.includes(a) && S.known.includes(b) && !S.known.includes(c));
}
function discover(id) {
  if (S.known.includes(id)) return;
  S.known.push(id);
  S.fresh = [...(S.fresh || []), id].slice(-6);
}
function night(t) { const h = new Date(t).getHours(); return h >= 22 || h < 7; }

// Една минута от живота му. offline = докато никой не гледа.
function minute(t, offline, ev) {
  if (S.asleep) {
    S.energy = clamp(S.energy + 1.2);
    if (S.energy >= 100 && !night(t)) { S.asleep = false; log("☀️ Събуди се бодър.", t); }
    else if (S.energy >= 100 && Math.random() < 0.02) { S.asleep = false; log("☀️ Събуди се.", t); }
  } else {
    S.energy = clamp(S.energy - (night(t) ? 0.25 : 1 / 6));
    if (S.energy <= 8) { S.asleep = true; log("😴 Заспа от умора.", t); }
  }
  S.hunger = clamp(S.hunger + (S.asleep ? 1 / 14 : 1 / 8));
  if (!S.asleep) S.mess = clamp(S.mess + 1 / 90);            // прашинки се трупат
  if (!S.asleep && S.mess > 65 && S.energy > 30 && Math.random() < 1 / 30) {   // Дева: не издържа на бъркотия
    S.mess = clamp(S.mess - 45); S.energy = clamp(S.energy - 4); S.mood = clamp(S.mood + 3);
    log("🧹 Не издържа на бъркотията и подреди сам. Дева си е Дева.", t);
    if (!offline) selfCleaned = true;
  }
  if (S.hunger >= 95) S.health = clamp(S.health - 0.1);
  else if (S.hunger < 70) S.health = clamp(S.health + (S.hurt ? 0.03 : 0.1));
  if (S.hurt && S.health >= 95) S.hurt = 0;
  let target = 65 - (S.hunger > 70 ? 20 : 0) - (S.hurt ? 15 : 0) - (S.mess > 70 ? 15 : 0) - (S.health < 40 ? 15 : 0);
  S.mood = clamp(S.mood + Math.sign(target - S.mood) * 0.1);

  if (offline && !S.asleep && S.energy > 30 && ev.n < 3 && Math.random() < 1 / 180) {
    ev.n++;
    const c = candidates();
    if (c.length && Math.random() < 0.35) {
      const r = pick(c)[2]; discover(r); S.skill += 0.4; S.mood = clamp(S.mood + 15);
      log(`🎉 Докато те нямаше, сам изобрети ${name(r)}!`, t);
    } else {
      S.hurt = 1; S.health = clamp(S.health - 8); S.skill += 0.5; S.mess = clamp(S.mess + 10);
      log(pick(["🤕 Докато те нямаше, опита нещо и се удари.", "🤕 Сам си майстори нещо и се опари.", "🤕 Опита сам, но винтчето отхвърча."]), t);
    }
  }
}
let selfCleaned = false;
function catchUp(now) {
  const offline = role === "keeper" && now - S.t > 3 * MIN;
  const ev = { n: 0 };
  let steps = 0;
  if (now - S.t > 14 * 24 * 60 * MIN) S.t = now - 14 * 24 * 60 * MIN;
  while (S.t + MIN <= now) { minute(S.t + MIN, offline, ev); S.t += MIN; steps++; }
  if (steps) dirty = true;
  return steps;
}

// ---------- Говорене ----------
const CHATTER = [
  ["🧐", "Проверявам винтчетата… пак."], ["📋", "Правя списък на списъците."], ["🧽", "Тук има прашинка!"],
  ["📐", "Всичко трябва да е под прав ъгъл."], ["🤓", "Обичам технологиите!"], ["🔧", "Мисля, мисля…"],
  ["🗂️", "Подредих болтовете по размер."], ["🔬", "Това трябва да се изследва."],
];
function chatter() {
  if (role !== "keeper" || S.asleep || S.want || performance.now() < bubbleUntil + 30000) return;
  if (Math.random() > 0.3) return;
  if (S.mess > 50) return say("😖", "Каква бъркотия…");
  const c = candidates();
  if (c.length && Math.random() < 0.25) { const [a, b] = pick(c); return say("💭", `Чудя се какво става от ${E[a][0]} и ${E[b][0]}…`); }
  say(...pick(CHATTER));
}

// ---------- Желания ----------
function wants(now) {
  if (role !== "keeper" || S.asleep) return;
  if (S.want && now - S.want.t > 10 * MIN) {
    S.want = null; S.mood = clamp(S.mood - 5); dirty = true; say("😞", "Няма значение…");
    S.nextWant = now + rnd(3, 6) * MIN;
  }
  if (S.want || now < S.nextWant) return;
  let w;
  if (S.hurt) w = { e: "🩹", k: "heal" };
  else if (S.hunger > 60) w = { e: pick(["🍕", "🥦", "🥦", "🦐"]), k: "food" };
  else if (S.mess > 60) w = { e: "🧹", k: "tidy" };
  else if (S.mood < 40) w = { e: "🤗", k: "hug" };
  else if (Math.random() < 0.6) { const id = pick(S.known); w = { e: E[id][0], k: "item", id }; }
  else w = { e: "❤️", k: "love" };
  S.want = { ...w, t: now }; dirty = true;
  bubbleUntil = 0;
  renderInv();
}
function fulfil(now) {
  S.want = null; S.mood = clamp(S.mood + 12); S.skill += 0.1;
  S.nextWant = now + rnd(3, 7) * MIN;
  say("😍", "Точно това исках! Благодаря!");
}

// ---------- Емотикони ----------
const EMOJIS = ["🍕", "🩹", "🧹", "😴", "☀️", "❤️", "👍", "😂", "🤗", "🎉", "💡", "👋"];
function sendEmoji(e) {
  if (role !== "keeper") return;
  const now = Date.now();
  S.lastCare = now; dirty = true;
  if (S.want && S.want.k !== "item" && S.want.e === e) {
    act(e, now, true);
    log(`${e} Даде му каквото искаше.`);
    fulfil(now); return save();
  }
  act(e, now, false);
  save();
}
function act(e, now, wanted) {
  if (S.asleep && e !== "☀️" && e !== "❤️") return say("💤", "Шшш… спи.");
  switch (e) {
    case "🍕": case "🥦": case "🦐": return eat(e, now, wanted);
    case "🩹":
      if (!S.hurt && S.health >= 80) return say("🤔", "Нищо ми няма.");

// ---------- Дева: храна по режим ----------
function eat(e, now, wanted) {
  if (S.hunger < 25) { S.mood = clamp(S.mood - 2); return say("🙅", "Не съм гладен. Режимът си е режим! 📋"); }
  const h = new Date(now).getHours() + new Date(now).getMinutes() / 60, day = new Date(now).toDateString();
  const usual = S.meals.filter(m => m.d !== day && Math.abs(m.h - h) < 0.75).length >= 2;
  S.meals = [...S.meals, { h, d: day }].slice(-14);
  S.lastMeal = now; tick("feed");
  if (e === "🥦") { S.hunger = clamp(S.hunger - 30); S.health = clamp(S.health + 6); S.mood = clamp(S.mood + 2); tick("veg"); }
  else if (e === "🦐") { S.hunger = clamp(S.hunger - 40); S.mood = clamp(S.mood + 5); }
  else { S.hunger = clamp(S.hunger - 45); S.mood = clamp(S.mood + 3); }
  if (usual) { S.mood = clamp(S.mood + 6); return say("⏰😌", "Точно навреме! Обичам режим."); }
  if (e === "🥦") return say("🥦✅", "Здравословно! Одобрявам.");
  if (e === "🦐") return say("😋", "Скариди! Свежи са, проверих.");
  if (!wanted && Math.random() < 0.35) return say("😋🧐", "Вкусно… но малко мазно. Следващия път нещо здравословно? 🥦");
  return say("😋", "Ммм, пица!");
}
function grumble(now) {              // мърмори, ако закъснееш с храната
  if (role !== "keeper" || S.asleep || S.hunger < 50 || now - S.lastMeal < 2 * 60 * MIN || now - S.lastGrumble < 60 * MIN) return;
  const h = new Date(now).getHours() + new Date(now).getMinutes() / 60, day = new Date(now).toDateString();
  const late = S.meals.some(m => m.d !== day && h - m.h > 1 && h - m.h < 3 &&
    S.meals.filter(n => n.d !== day && Math.abs(n.h - m.h) < 0.75).length >= 2);
  if (!late) return;
  S.lastGrumble = now; S.mood = clamp(S.mood - 3); dirty = true;

// ---------- Дева: списък за деня ----------
const TODO = [["feed", "🍕", "Да хапна"], ["tidy", "🧹", "Да е подредено"], ["invent", "🔧", "Да пробвам изобретение"],
  ["love", "❤️", "Малко обич"], ["hint", "💡", "Да помисля над идея"], ["veg", "🥦", "Нещо здравословно"]];
function ensureTodo(now) {
  const day = new Date(now).toDateString();
  if (S.todo && S.todo.day === day) return;
  const pool = [...TODO].sort(() => Math.random() - 0.5).slice(0, 3);
  S.todo = { day, items: pool.map(([k, e, x]) => ({ k, e, x, done: false })), all: false };
  dirty = true;
}
function tick(k) {

  setTimeout(() => say("✅", "Отметнах: " + it.x), 4600);
  if (!S.todo.all && S.todo.items.every(i => i.done)) {
    S.todo.all = true; S.mood = clamp(S.mood + 15); S.skill += 0.3;
    log("📋✅ Изпълни целия списък за деня!");
    setTimeout(() => { fx.party = performance.now(); say("📋✅", "Целият списък е отметнат! Обожавам това!", 6000); }, 9300);
  }
}
function worries() {                  // какво не е наред, докато те е нямало

  if (S.hunger > 60) w.push("🍕 гладен съм");

// ---------- Запазване ----------
let docRef = null, unsub = null;
async function save(force) {
  if (role !== "keeper" || !S) return;
  const now = Date.now();
  if (!force && !dirty) return;
  if (!force && now - lastSave < 3000) { setTimeout(() => save(), 3100); return; }
  dirty = false; lastSave = now;
  if (DEMO) { try { localStorage.setItem("oktonis", JSON.stringify(S)); } catch {} return; }
  try { await fb.F.setDoc(docRef, { s: JSON.stringify(S), by: session, at: now }); } catch (e) { console.warn(e); }
}
async function load(user) {
  const now = Date.now();
  if (DEMO) {
    try { S = JSON.parse(localStorage.getItem("oktonis")); } catch {}
    if (!S) S = fresh(now);
    return afterLoad();
  }
  docRef = fb.F.doc(fb.db, "world", "oktonis");
  unsub = fb.F.onSnapshot(docRef, snap => {
    const d = snap.data();
    if (!d) {
      if (role === "keeper" && !S) { S = fresh(Date.now()); dirty = true; save(true); afterLoad(); }
      else if (!S) { $("loadView").innerHTML = "<p>Октонис още не се е излюпил 🥚</p>"; }
      return;
    }
    if (d.by === session && S) return;
    const incoming = JSON.parse(d.s);
    if (S && role === "keeper" && incoming.t < S.t - 2 * MIN) return;
    const first = !S;
    S = incoming;
    if (first) afterLoad(); else { catchUpView(); render(); }
  }, err => { $("loadView").innerHTML = `<p>Грешка: ${err.message}</p>`; });
}
function catchUpView() {
  // зрителят не пише, само смята напред от последното записано
  if (role === "viewer") { const copy = JSON.stringify(S); catchUp(Date.now()); viewBase = copy; }
}
let viewBase = null;
function afterLoad() {
  S.meals = S.meals || []; S.lastMeal = S.lastMeal || Date.now(); S.lastGrumble = S.lastGrumble || 0;
  if (role === "viewer") viewBase = JSON.stringify(S);
  const before = S.journal.length ? S.journal[0].t : 0;
  const steps = catchUp(Date.now());
  if (role === "keeper" && steps > 60) {
    const missed = S.journal.filter(j => j.t > before && j.t > Date.now() - steps * MIN).length;
    const w = worries();
    if (w.length) say("📋", "Докато те нямаше, записах:\n" + w.join("\n"), 9000);
    else say("👋🐙", missed ? "Липсваше ми! Виж дневника." : "Липсваше ми! Всичко е наред, проверих.", 5000);
    S.lastCare = Date.now();
  }
  save();
  show("gameView"); buildStatic(); render();
}

// ---------- Менюто около него ----------

    b.className = "rb"; b.style.left = x + "px"; b.style.top = y + "px";
    b.innerHTML = ic + (label ? `<small>${label}</small>` : "");
    if ((want === id && ringPage === "main") || (ringPage === "food" && S.want && S.want.k === "food" && id === "e" + S.want.e)) b.classList.add("want");
    b.onclick = ev => { ev.stopPropagation(); ringAction(id); };
    box.appendChild(b);
    setTimeout(() => b.classList.add("open"), 20 + i * 25);
  });
}
function ringAction(id) {
  if (id === "talk" || id === "food") { ringPage = id; return paintRing(); }
  if (id === "back") { ringPage = "main"; return paintRing(); }
  if (id === "work" || id === "stats" || id === "journal") return openSheet(id);
  if (id === "full") { closeRing(); return toggleFull(); }
  if (id === "logout") { closeRing(); return logout(); }
  const map = { heal: "🩹", tidy: "🧹", sleep: "😴", wake: "☀️" };
  const e = map[id] || id.slice(1);
  sendEmoji(e);
  if (ringPage === "talk") paintRing(); else closeRing();
}

// ---------- Говорене (балончето следва Октонис) ----------
let bubbleUntil = 0;
function say(e, t = "", ms = 4500) { bubbleUntil = performance.now() + ms; showBubble(e, t, false); }
function showBubble(e, t, want) {
  $("bubbleE").textContent = e; $("bubbleT").textContent = t;
  $("bubble").classList.toggle("want", want); $("bubble").classList.toggle("hidden", !inGame);
}
function updateBubble() {
  if (!inGame || performance.now() < bubbleUntil) return;
  if (S.want && !S.asleep) {
    const w = S.want;
    const txt = { food: "Гладен съм…", heal: "Боли ме… имаш ли лепенка?", tidy: "Тук е бъркотия!", hug: "Тъжно ми е…", love: "Обичаш ли ме?",
      item: `Трябва ми ${E[w.id]?.[1] || ""} за проекта!` }[w.k];
    showBubble(w.e + " ?", txt, true);
  } else $("bubble").classList.add("hidden");
}
function placeBubble() {
  const b = $("bubble");
  const w = b.offsetWidth / 2 + 8;
  const x = Math.max(w, Math.min(innerWidth - w, oct.x));
  const y = Math.max(b.offsetHeight + 16, oct.top - 18);
  b.style.left = x + "px"; b.style.top = y + "px";
}

// ---------- Морето ----------
const cv = $("sea"), g = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  if (ringOpen) closeRing();
}
addEventListener("resize", resize); resize();
const fx = { party: -1e9, hurt: -1e9 };
const st = {};
const bubbles = Array.from({ length: 34 }, () => newBubble(true));
function newBubble(any) {
  return { x: Math.random(), y: any ? Math.random() : 1.05, r: rnd(2, 9), s: rnd(0.02, 0.06), p: rnd(0, 6) };
}
const weeds = Array.from({ length: 7 }, (_, i) => ({ x: (i + 0.5) / 7 + rnd(-0.04, 0.04), h: rnd(0.12, 0.26), p: rnd(0, 6), c: pick(["#3fae77", "#57c08a", "#2f9466"]) }));
const oct = { x: 0, y: 0, cy: 0, top: 0, r: 100, px: null, py: null };
let lastMode = "", modeAt = 0;
function octoMode() {
  const p = performance.now();
  if (drag && drag.moved) return drag.mood;
  if (working) return "work";
  if (p - fx.party < 4000) return "party";
  if (S.asleep) return "sleep";
  if (S.hurt || p - fx.hurt < 2500) return "hurt";
  if (S.mood > 70) return "happy";
  return "idle";
}
function drawSea(t, night) {
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, night ? "#1b4a73" : "#5fd0e0"); sky.addColorStop(0.45, night ? "#123a62" : "#2a8fbf"); sky.addColorStop(1, night ? "#0a2140" : "#14507e");
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  // слънчеви лъчи
  for (let i = 0; i < 5; i++) {
    const x = W * (0.1 + i * 0.2) + Math.sin(t * 0.3 + i * 1.7) * W * 0.05, w = W * (0.04 + (i % 3) * 0.02);
    const gr = g.createLinearGradient(0, 0, 0, H * 0.85);
    gr.addColorStop(0, `rgba(255,255,240,${night ? 0.04 : 0.14})`); gr.addColorStop(1, "rgba(255,255,240,0)");
    g.fillStyle = gr; g.beginPath(); g.moveTo(x - w / 2, 0); g.lineTo(x + w / 2, 0); g.lineTo(x + w * 2.2 + W * 0.08, H * 0.85); g.lineTo(x - w * 0.8 + W * 0.08, H * 0.85); g.fill();
  }
  // пясък и водорасли
  const sandY = H * 0.88;
  for (const wd of weeds) {
    const x0 = wd.x * W, hgt = wd.h * H, n = 14;
    const pts = [];
    for (let j = 0; j <= n; j++) { const k = j / n; pts.push([x0 + Math.sin(t * 1.1 + wd.p + k * 3) * 18 * k, sandY + 10 - hgt * k, k]); }
    for (const pass of [0, 1]) {
      g.fillStyle = pass ? wd.c : "#1f3a35";
      for (const [x, y, k] of pts) { g.beginPath(); g.arc(x, y, (11 - 7 * k) + (pass ? 0 : 3.5), 0, Math.PI * 2); g.fill(); }
    }
  }
  g.fillStyle = "#e9d39c"; g.strokeStyle = "#2b2a33"; g.lineWidth = 4;
  g.beginPath(); g.moveTo(-10, H + 10); g.lineTo(-10, sandY);
  for (let x = 0; x <= W + 40; x += 40) g.quadraticCurveTo(x - 20, sandY + Math.sin(x * 0.03) * 8 - 10, x, sandY + Math.sin(x * 0.05) * 6);
  g.lineTo(W + 10, H + 10); g.closePath(); g.fill(); g.stroke();
  g.fillStyle = "#d8bd80";
  for (let i = 0; i < 12; i++) { const x = ((i * 137) % 100) / 100 * W, y = sandY + 18 + ((i * 53) % 30); g.beginPath(); g.ellipse(x, y, 5, 3, 0, 0, Math.PI * 2); g.fill(); }
}
function drawBubbles(t) {
  g.lineWidth = 2;
  for (const b of bubbles) {
    b.y -= b.s / 60 * (1 + b.r / 10);
    if (b.y < -0.05) Object.assign(b, newBubble(false));
    const x = b.x * W + Math.sin(t * 1.5 + b.p) * 8, y = b.y * H;
    g.strokeStyle = "rgba(255,255,255,.7)"; g.fillStyle = "rgba(255,255,255,.12)";
    g.beginPath(); g.arc(x, y, b.r, 0, Math.PI * 2); g.fill(); g.stroke();
    g.fillStyle = "rgba(255,255,255,.8)"; g.beginPath(); g.arc(x - b.r * 0.35, y - b.r * 0.35, b.r * 0.25, 0, Math.PI * 2); g.fill();
  }
}
let frameN = 0;
function loop() {
  requestAnimationFrame(loop);
  if (frameN++ % 2) return;                 // 30 кадъра стигат
  const t = performance.now() / 1000;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const night = S && S.asleep;
  drawSea(t, night);
  drawBubbles(t);
  // къде плува
  const s = Math.min(H * 0.46 / 430, W * 0.8 / 560);
  let tx = W / 2 + Math.sin(t * 0.11) * W * 0.16 + Math.sin(t * 0.29) * W * 0.04;
  let ty = H * 0.46 + Math.sin(t * 0.17) * H * 0.05;
  const mode = S ? octoMode() : "idle";
  const ground = H * 0.88 + 6;
  if (mode === "sleep" || mode === "work") { tx = oct.px ?? tx; ty = ground - 201 * s; }   // слиза на дъното
  if (ringOpen || sheetKind) { tx = oct.px; ty = oct.py; }
  if (oct.px == null) { oct.px = tx; oct.py = ty; }
  if (!(drag && drag.moved)) { const k = mode === "sleep" || mode === "work" ? 0.035 : 0.02; oct.px += (tx - oct.px) * k; oct.py += (ty - oct.py) * k; }
  if (mode !== lastMode) { lastMode = mode; modeAt = t; }
  const near = oct.py > ground - 260 * s && !(drag && drag.moved);
  const info = Octo.draw(g, { x: oct.px, y: oct.py - 46 * s, s, age: S ? AGE : "egg", mode, t, mt: t - modeAt, st,
    ground: near ? ground : null, drop: false });
  oct.x = oct.px; oct.cy = info.cy; oct.top = info.top; oct.r = info.r;
  if (Math.random() < 0.02) bubbles[Math.floor(Math.random() * bubbles.length)] = { x: (oct.x + rnd(-20, 20)) / W, y: info.top / H, r: rnd(2, 5), s: 0.05, p: rnd(0, 6) };
  if (night) { g.fillStyle = "rgba(10,10,40,.25)"; g.fillRect(0, 0, W, H); }
  if (inGame) placeBubble();
}
requestAnimationFrame(loop);

// ---------- Докосване, влачене и мишка ----------
const canHover = matchMedia("(hover: hover) and (pointer: fine)").matches;
const onOcto = (x, y) => Math.hypot(x - oct.x, y - oct.cy) < oct.r * 0.6;
let drag = null, noHover = false;
cv.addEventListener("pointerdown", ev => {
  if (!inGame || !S || sheetKind || !onOcto(ev.clientX, ev.clientY)) return;
  drag = { id: ev.pointerId, sx: ev.clientX, sy: ev.clientY, dx: oct.px - ev.clientX, dy: oct.py - ev.clientY, moved: false };
  try { cv.setPointerCapture(ev.pointerId); } catch {}
});
cv.addEventListener("pointermove", ev => {
  if (!drag || ev.pointerId !== drag.id) return;
  if (!drag.moved && Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy) > 10) {
    drag.moved = true; closeRing(); startDrag();
  }
  if (drag.moved) { oct.px = ev.clientX + drag.dx; oct.py = ev.clientY + drag.dy; }
});
cv.addEventListener("pointerup", ev => {
  if (drag && ev.pointerId === drag.id) {
    const d = drag; drag = null;
    if (d.moved) return endDrag(d);
    if (ringOpen) { if (!canHover) closeRing(); } else openRing();
    return;
  }
  if (inGame && ringOpen) closeRing();
});
cv.addEventListener("pointercancel", () => { if (drag && drag.moved) endDrag(drag); drag = null; });
function startDrag() {
  const happy = S.mood >= 50 && !S.hurt && !S.asleep && S.hunger < 75;
  drag.mood = happy ? "wee" : "angry";
  noHover = true;
  if (S.asleep) {
    if (role === "keeper") { S.asleep = false; S.mood = clamp(S.mood - 5); dirty = true; log("😠 Събуди го, като го повлече."); }
    return say("😠💢", "Спях! Защо ме будиш?!");
  }
  if (happy) say("🎢", pick(["Уииии!", "Летяяя! 🚀", "Още, още! 😆", "Като влакче в увеселителен парк!"]));
  else say("😠💢", pick(["Пусни ме!", "Не сега!", "Не съм в настроение!", "Остави ме на мира!"]));
}
function endDrag(d) {
  if (role === "keeper") {
    S.mood = clamp(S.mood + (d.mood === "wee" ? 3 : -3)); S.lastCare = Date.now(); dirty = true;
    if (d.mood === "wee") tick("love");
    save();
  }
  if (d.mood === "wee") say("😆", pick(["Пак!", "Беше страхотно!", "Хи-хи!"]));
  else say("😤", "Хмпф.");
}
let leaveTimer = 0;
if (canHover) addEventListener("mousemove", ev => {
  if (!inGame || sheetKind || drag) return;
  const over = onOcto(ev.clientX, ev.clientY);
  cv.style.cursor = over ? "grab" : "";
  if (!over && !ringOpen) noHover = false;
  const d = Math.hypot(ev.clientX - (ringOpen ? ringCenter[0] : oct.x), ev.clientY - (ringOpen ? ringCenter[1] : oct.cy));
  if (!ringOpen && over && !noHover) openRing();
  else if (ringOpen && d > ringR + 70) { if (!leaveTimer) leaveTimer = setTimeout(() => { leaveTimer = 0; closeRing(); }, 450); }
  else if (leaveTimer) { clearTimeout(leaveTimer); leaveTimer = 0; }
});
// плъзгане отдолу нагоре на телефона: „Как е“; отгоре надолу по панела: затваря
let swipe = null;
addEventListener("touchstart", ev => {
  const t0 = ev.touches[0];
  swipe = { x: t0.clientX, y: t0.clientY, onSheet: $("sheet").contains(ev.target), top: $("sheet").scrollTop };
}, { passive: true });
addEventListener("touchend", ev => {
  if (!swipe || !inGame) return;
  const t1 = ev.changedTouches[0], dx = t1.clientX - swipe.x, dy = t1.clientY - swipe.y;
  if (!sheetKind && !drag && dy < -60 && Math.abs(dx) < 90 && swipe.y > H * 0.55 && !onOcto(swipe.x, swipe.y)) openSheet("stats");
  else if (sheetKind && swipe.onSheet && swipe.top <= 0 && dy > 70) closeSheet();
  swipe = null;
}, { passive: true });

// ---------- Таймер ----------
let lastMinuteCheck = 0, chatTick = 1;
setInterval(() => {
  if (!S || !inGame) return;
  const now = Date.now();
  if (role === "keeper") {
    if (catchUp(now)) render();
    ensureTodo(now);
    if (selfCleaned) { selfCleaned = false; say("🧹😤", "Не мога така! Подредих сам."); }
    grumble(now);
    wants(now);
    if (chatTick++ % 45 === 0) chatter();
    if (dirty && now - lastSave > 60000) save();
  } else if (viewBase && now - lastMinuteCheck > 20000) {
    lastMinuteCheck = now;
    S = JSON.parse(viewBase); catchUp(now); render();
  }
  updateBubble();
}, 1000);
document.addEventListener("visibilitychange", () => { if (document.hidden) save(true); });
window.addEventListener("pagehide", () => save(true));

// ---------- Вход ----------
let myNick = "";
function startAs(nick) {
  myNick = nick;
  role = nick === KEEPER ? "keeper" : "viewer";
  show("loadView");
  load();
}
$("loginForm").onsubmit = async ev => {
  ev.preventDefault();
  const nick = $("nick").value.trim().toLowerCase(), pass = $("pass").value;
  if (!nick || !pass) return;
  $("loginErr").textContent = ""; $("loginBtn").disabled = true;
  try { await fb.A.signInWithEmailAndPassword(fb.auth, nick + "@oktonis.app", pass); }
  catch (e) { $("loginErr").textContent = "Грешен ник или парола 🙈"; }
  $("loginBtn").disabled = false;
};
async function logout() {
  await save(true);
  if (unsub) unsub();
  S = null; viewBase = null;
  show("loginView");
  if (!DEMO) await fb.A.signOut(fb.auth);
}
if (DEMO) window.__okt = { get S() { return S; }, oct, fx, work: v => { working = v ? performance.now() : 0; } };   // за проби
if (DEMO) startAs(new URLSearchParams(location.search).get("demo") || KEEPER);
else fb.A.onAuthStateChanged(fb.auth, user => {
  if (user) startAs(user.email.split("@")[0]);
  else { S = null; show("loginView"); }
});
</script>
