<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Октонис</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Октонис">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1d6f99">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap">
<style>
  :root { --ink: #2b2a33; --text: #f6efe6; --muted: #c9dbe8; --peach: #f4a07a; --gold: #ffd166; --red: #ff6b81; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e3558; color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  .hidden { display: none !important; }
  #sea { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* балонче с говор */
  #bubble { position: fixed; left: 0; top: 0; transform: translate(-50%, -100%); pointer-events: none; width: min(250px, 70vw);
    background: #fffaf2; color: #2a1730; border: 3px solid var(--ink); border-radius: 18px; padding: 6px 14px 8px;
    text-align: center; max-width: min(280px, 80vw); box-shadow: 0 4px 0 rgba(0,0,0,.25); transition: opacity .2s; z-index: 3; }
  #bubble::after { content: ""; position: absolute; left: 50%; bottom: -12px; margin-left: -9px; width: 16px; height: 16px;
    background: #fffaf2; border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); transform: rotate(45deg); }
  #bubble .e { font-size: 26px; line-height: 1.15; }
  #bubble .t { font-size: 13px; line-height: 1.3; white-space: pre-line; }
  #handle { position: fixed; left: 50%; bottom: max(8px, env(safe-area-inset-bottom)); width: 120px; margin-left: -60px; height: 26px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 2; }
  #handle::before { content: ""; width: 54px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.75); box-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .todo { list-style: none; margin: 4px 0 12px; padding: 0; }
  .todo li { padding: 3px 0; font-size: 14px; }
  .todo li.done { color: var(--muted); text-decoration: line-through; }
  #bubble.want { background: #fff3c4; animation: pulse 1.2s infinite; }
  #bubble.want::after { background: #fff3c4; }
  @keyframes pulse { 50% { background: #ffe9a0; } }
  #hud { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 3; text-align: center; cursor: pointer; }
  #hud b { display: block; font-size: 14px; text-shadow: 0 1px 3px rgba(0,0,0,.6); margin-bottom: 4px; }
  #meters { display: flex; gap: 7px; justify-content: center; }
  .mt.s { width: 38px; height: 38px; } .mt.s span { width: 29px; height: 29px; font-size: 15px; }
  #grow { height: 6px; width: 100%; border-radius: 3px; background: rgba(0,0,0,.3); margin-top: 6px; overflow: hidden; }
  #grow i { display: block; height: 100%; background: linear-gradient(90deg, #b39ddb, #ffd166); border-radius: 3px; transition: width .6s; }
  #profBtn { position: fixed; top: max(8px, env(safe-area-inset-top)); right: 10px; width: 42px; height: 42px; border-radius: 50%; padding: 0; font-size: 20px;
    background: rgba(255,250,242,.9); border: 3px solid var(--ink); z-index: 4; }
  #profMenu { position: fixed; top: calc(max(8px, env(safe-area-inset-top)) + 50px); right: 10px; z-index: 9; background: rgba(18,40,68,.95); border: 3px solid var(--ink);
    border-radius: 14px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 170px; }
  .pm-who { font-size: 13px; color: var(--muted); padding: 4px 6px; }
  #side { position: fixed; right: 10px; top: calc(max(8px, env(safe-area-inset-top)) + 62px); display: flex; flex-direction: column; gap: 14px; z-index: 3; }
  #side button { width: 46px; height: 46px; border-radius: 50%; padding: 0; font-size: 22px; background: rgba(255,250,242,.9); border: 3px solid var(--ink);
    box-shadow: 0 3px 0 rgba(0,0,0,.25); position: relative; }
  #side small { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 700; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.8); white-space: nowrap; }
  #mixbar { position: fixed; left: 84px; right: 12px; bottom: calc(max(10px, env(safe-area-inset-bottom)) + 4px); max-width: 430px; z-index: 8;
    display: grid; grid-template-columns: repeat(5, 1fr) 54px; gap: 6px; }
  #mixbar .slot { height: 52px; border-radius: 14px; background: rgba(12,30,54,.55); border: 2px dashed rgba(255,255,255,.4); display: grid; place-items: center; font-size: 26px; cursor: pointer; }
  #mixbar .slot.full { border: 3px solid var(--ink); background: rgba(255,250,242,.9); }
  #mixbar .slot.over { background: rgba(255,209,102,.6); }
  #mixbar button { height: 52px; border-radius: 14px; padding: 0; font-size: 24px; background: var(--peach); border: 3px solid var(--ink); }
  #mixbar button:disabled { opacity: .5; }
  body.hasbar #sheet { bottom: calc(max(10px, env(safe-area-inset-bottom)) + 62px); border-bottom: 3px solid var(--ink); border-radius: 24px; }
  body.hasbar #hint { bottom: calc(max(10px, env(safe-area-inset-bottom)) + 70px); }
  #ghost { position: fixed; z-index: 10; pointer-events: none; font-size: 44px; transform: translate(-50%, -120%); }

  /* менюто около него */
  .rb { position: fixed; left: 0; top: 0; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%;
    background: rgba(255,250,242,.95); border: 3px solid var(--ink); box-shadow: 0 4px 0 rgba(0,0,0,.28);
    font-size: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
    transform: scale(0); opacity: 0; transition: transform .2s cubic-bezier(.3,1.6,.6,1), opacity .15s; z-index: 4; }
  .rb.open { transform: scale(1); opacity: 1; }
  .rb:active { transform: scale(.9); }
  .rb small { position: absolute; top: 100%; margin-top: 5px; left: 50%; transform: translateX(-50%); white-space: nowrap;
    font-size: 11px; font-weight: 700; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.8); pointer-events: none; }
  .rb.want { background: var(--gold); animation: wig .5s infinite; }
  @keyframes wig { 25% { rotate: -8deg; } 75% { rotate: 8deg; } }

  #top { position: fixed; top: calc(max(10px, env(safe-area-inset-top)) + 72px); left: 0; right: 0; text-align: center; font-size: 13px;
    color: #eaf6ff; text-shadow: 0 1px 3px rgba(0,0,0,.6); pointer-events: none; z-index: 2; }
  #hint { position: fixed; bottom: calc(max(8px, env(safe-area-inset-bottom)) + 36px); left: 0; right: 0; text-align: center; font-size: 14px;
    color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.7); pointer-events: none; animation: fade 2.4s infinite; z-index: 2; }
  @keyframes fade { 50% { opacity: .45; } }

  /* панел отдолу (работилница, как е, дневник) */
  #scrim { position: fixed; inset: 0; z-index: 5; }
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 560px; max-height: 72vh; overflow-y: auto;
    background: rgba(18,40,68,.9); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 3px solid var(--ink); border-bottom: 0; border-radius: 24px 24px 0 0; z-index: 6;
    padding: 14px 16px max(18px, env(safe-area-inset-bottom)); transform: translateY(calc(100% + 140px)); transition: transform .25s ease; }
  #sheet.open { transform: translateY(0); }
  #sheet h2 { font-size: 17px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; }
  #sheet h2 span { color: var(--muted); font-size: 13px; font-weight: 500; }
  .x { background: none; border: 0; color: var(--muted); font-size: 22px; cursor: pointer; padding: 0 4px; }
  button { font: inherit; color: var(--text); background: rgba(255,255,255,.12); border: 0; border-radius: 12px; padding: 10px; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  .bench { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 8px; align-items: center; margin-bottom: 12px; }
  .slot { height: 62px; border: 2px dashed rgba(255,255,255,.35); border-radius: 14px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-size: 28px; cursor: pointer; }
  .slot small { font-size: 11px; color: var(--muted); }
  .slot.full { border-style: solid; border-color: var(--peach); }
  .plus { font-size: 22px; color: var(--muted); }
  .try { background: var(--peach); color: #2a1730; font-weight: 700; padding: 12px 14px; }
  .inv { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; }
  .inv button { display: flex; flex-direction: column; align-items: center; padding: 8px 4px; gap: 2px; }
  .inv button span { font-size: 26px; line-height: 1.1; }
  .inv button small { font-size: 11px; color: var(--muted); line-height: 1.15; text-align: center; }
  .inv button.new { box-shadow: 0 0 0 2px var(--gold) inset; }
  .inv button.wanted { box-shadow: 0 0 0 3px var(--gold) inset; animation: wig .6s infinite; }
  .bars { display: grid; gap: 8px; }
  .bar { display: grid; grid-template-columns: 26px 1fr 34px; align-items: center; gap: 8px; font-size: 13px; }
  .bar .ic { font-size: 17px; text-align: center; }
  .track { height: 10px; background: rgba(0,0,0,.35); border-radius: 6px; overflow: hidden; }
  .fill { height: 100%; border-radius: 6px; }
  .bar b { text-align: right; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; margin: 10px 0; }
  .journal { list-style: none; margin: 0; padding: 0; }
  .journal li { padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,.12); font-size: 14px; }
  .journal li time { color: var(--muted); font-size: 12px; margin-right: 6px; }

  .idea { display: flex; gap: 12px; align-items: flex-start; background: rgba(255,255,255,.08); border-radius: 14px; padding: 10px; margin-bottom: 10px; }
  .idea .ie { font-size: 40px; line-height: 1; }
  .needs { display: flex; flex-wrap: wrap; gap: 6px; }
  .needs span { background: rgba(0,0,0,.25); border-radius: 999px; padding: 3px 9px; font-size: 13px; }
  .needs span.ok { background: rgba(111,211,160,.3); }
  .made { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-top: 6px; }
  .made div { background: rgba(255,255,255,.08); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 2px; }
  .made span { font-size: 28px; } .made small { color: var(--muted); font-size: 11px; line-height: 1.25; }
  .try { width: 100%; }
  .it { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,.1); }
  .it .ii { font-size: 28px; text-align: center; }
  .it .in { display: flex; flex-direction: column; font-size: 15px; } .it .in small { color: var(--muted); font-size: 12px; }
  .sell { background: #ffd166; color: #2a1730; font-weight: 700; padding: 8px 12px; }
  .grp { margin: 12px 0 2px; font-weight: 700; color: #ffe7a8; }
  .tabs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 10px; }
  .tabs button { padding: 8px 2px; font-size: 13px; } .tabs button.on { background: var(--peach); color: #2a1730; font-weight: 700; }
  .lock { display: flex; gap: 14px; align-items: center; font-size: 44px; background: rgba(0,0,0,.25); border-radius: 14px; padding: 16px; }
  .lock div { font-size: 15px; } .lock small { color: var(--muted); }
  .mix { display: grid; grid-template-columns: 54px auto 54px 1fr; gap: 8px; align-items: center; margin-bottom: 6px; }
  .mix .slot { height: 54px; border-radius: 14px; background: rgba(0,0,0,.28); display: grid; place-items: center; font-size: 30px; cursor: pointer; }
  .btns { display: flex; gap: 5px; } .btns button { padding: 8px 9px; } .add { background: #b39ddb; color: #2a1730; font-weight: 700; }
  .eat { background: #6fd3a0; color: #1f2a20; font-weight: 700; } .it.want { background: rgba(255,209,102,.14); border-radius: 10px; }
  #sheet.airy { background: linear-gradient(rgba(10,30,60,0), rgba(10,30,60,.55) 30%); border: 0; -webkit-backdrop-filter: none; backdrop-filter: none; text-align: center; padding-top: 26px; }
  .who { font-size: 22px; font-weight: 800; text-shadow: 0 2px 6px rgba(0,0,0,.5); } .who small { display: block; font-size: 13px; font-weight: 500; color: #d8ecff; }
  .meters { display: flex; justify-content: center; gap: 14px; margin: 16px 0 12px; flex-wrap: wrap; }
  .mt { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--c) calc(var(--v) * 1%), rgba(255,255,255,.18) 0); }
  .mt span { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; background: rgba(12,32,60,.75); }
  .feel { color: #eaf6ff; font-size: 15px; text-shadow: 0 1px 3px rgba(0,0,0,.6); margin-bottom: 6px; }
  .ghost { background: none; color: #cfe3f5; font-size: 13px; text-decoration: underline; margin-top: 8px; }
  .mixbar { position: sticky; bottom: calc(-1 * max(18px, env(safe-area-inset-bottom))); margin: 10px -16px calc(-1 * max(18px, env(safe-area-inset-bottom))); padding: 10px 16px max(14px, env(safe-area-inset-bottom));
    background: rgba(12,30,54,.97); border-top: 1px solid rgba(255,255,255,.12); display: grid; grid-template-columns: repeat(5, 1fr) auto; gap: 6px; align-items: center; }
  .mixbar .slot { height: 48px; border-radius: 12px; background: rgba(0,0,0,.3); border: 2px dashed rgba(255,255,255,.18); display: grid; place-items: center; font-size: 26px; cursor: pointer; }
  .mixbar .slot.full { border-style: solid; border-color: #b39ddb; }
  .mixbar .try { width: auto; padding: 12px; }
  .inv { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; background: rgba(0,0,0,.25); padding: 6px; border-radius: 12px; }
  .cell { aspect-ratio: 1; border-radius: 8px; background: rgba(255,255,255,.07); box-shadow: inset 0 2px 0 rgba(0,0,0,.35); display: grid; place-items: center;
    font-size: 28px; position: relative; touch-action: none; }
  .cell.full { background: rgba(255,255,255,.14); cursor: grab; } .cell.sel { outline: 3px solid var(--gold); } .cell.want { background: rgba(255,209,102,.35); }
  .cell b { position: absolute; right: 3px; bottom: 0; font-size: 13px; font-weight: 800; color: #fff; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; }
  .cell .fr { position: absolute; left: 4px; top: 4px; width: 8px; height: 8px; border-radius: 50%; } .fr.g { background: #6fd3a0; } .fr.y { background: #ffd166; } .fr.r { background: #ff6b6b; }
  .pick { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; padding: 8px 2px 0; }
  .pick .ii { font-size: 30px; } .pick .in { display: flex; flex-direction: column; } .pick small { color: var(--muted); font-size: 12px; }
  .zones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .zones span { border: 2px dashed rgba(255,255,255,.35); border-radius: 12px; padding: 12px; text-align: center; font-weight: 700; }
  .zones span.over, #mixbar.over .slot:not(.full) { background: rgba(255,209,102,.45); }
  .letter { background: #fbf3dc; color: #3a2a1a; border-radius: 6px; padding: 18px 18px 22px; font: italic 17px/1.5 Georgia, serif; transform: rotate(-1deg);
    box-shadow: 0 6px 18px rgba(0,0,0,.35); background-image: repeating-linear-gradient(transparent 0 25px, rgba(90,140,220,.18) 25px 26px); }
  .ntf code { display: block; background: rgba(0,0,0,.3); padding: 10px; border-radius: 10px; font-size: 16px; margin: 6px 0; -webkit-user-select: all; user-select: all; }
  .diary { display: grid; gap: 0; background: #7a4a26; padding: 10px; border-radius: 10px; box-shadow: inset 0 0 0 3px #5a3418, 0 8px 20px rgba(0,0,0,.4); }
  .diary.two { grid-template-columns: 1fr 1fr; }
  .diary .pg { position: relative; min-height: 340px; padding: 16px 16px 30px 34px; color: #3a2a1a; font: 20px/1.3 "Caveat", "Segoe Print", cursive;
    background: #fbf3dc repeating-linear-gradient(transparent 0 25px, rgba(90,140,220,.22) 25px 26px); background-position: 0 12px; }
  .diary .pg::before { content: ""; position: absolute; left: 24px; top: 0; bottom: 0; width: 2px; background: rgba(220,80,80,.45); }
  .diary.two .pg:first-child { box-shadow: inset -14px 0 16px -10px rgba(0,0,0,.35); border-radius: 6px 0 0 6px; }
  .diary.two .pg:last-child { box-shadow: inset 14px 0 16px -10px rgba(0,0,0,.35); border-radius: 0 6px 6px 0; }
  .diary:not(.two) .pg { border-radius: 6px; box-shadow: inset 14px 0 16px -10px rgba(0,0,0,.35); }
  .diary p { margin: 0 0 8px; } .diary time { display: block; font-size: 15px; color: #8a6a4a; }
  .diary .pn { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; font-size: 16px; color: #8a6a4a; }
  .shelf { background: #6b4226; border-radius: 8px; padding: 10px 10px 0; box-shadow: inset 0 0 0 4px #4e2e18; margin: 6px 0 10px; }
  .shelf .row { display: flex; align-items: flex-end; gap: 4px; height: 150px; border-bottom: 12px solid #8b5a34; box-shadow: 0 6px 0 #4e2e18; overflow-x: auto; padding: 0 4px; }
  .spine { position: relative; flex: 0 0 34px; border-radius: 4px 4px 0 0; border: 2px solid rgba(0,0,0,.35); cursor: pointer; display: flex; justify-content: center;
    box-shadow: inset -5px 0 0 rgba(0,0,0,.18), inset 4px 0 0 rgba(255,255,255,.15); }
  .spine em { writing-mode: vertical-rl; transform: rotate(180deg); font-style: normal; font-size: 11px; font-weight: 700; color: #fff7e6; padding: 6px 0; overflow: hidden; text-shadow: 0 1px 1px rgba(0,0,0,.5); }
  .spine i { position: absolute; top: 4px; font-style: normal; font-size: 12px; color: #fff; } .spine.sel { outline: 3px solid var(--gold); transform: translateY(-8px); }
  .spine u { position: absolute; bottom: 4px; text-decoration: none; font-size: 10px; font-weight: 800; background: #ffe7a8; color: #2a1730; border-radius: 4px; padding: 0 3px; white-space: nowrap; z-index: 1; }
  .shelf.shop .row { height: 160px; } .shelf.shop .spine em { padding-bottom: 24px; } .spine { flex-basis: 38px; } .shelf .empty { color: #e8d2b0; font-size: 13px; align-self: center; } .shelf .deco { font-size: 34px; margin-left: auto; }
  .cash { color: #ffe7a8; font-size: 15px; margin-right: 8px; }
  #bubble .t { font-size: 15px !important; }
  .life { background: rgba(255,255,255,.08); border-radius: 14px; padding: 10px 12px; margin-bottom: 12px; }
  .life small { color: var(--muted); }
  .stages { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
  .stages span { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: rgba(0,0,0,.25); color: var(--muted); }
  .stages span.past { color: #cfe9d9; } .stages span.cur { background: #b39ddb; color: #1d1830; font-weight: 700; }
  .fam { border-left: 3px solid #b39ddb; padding: 6px 10px; margin: 8px 0; background: rgba(255,255,255,.05); border-radius: 0 10px 10px 0; }
  .fam.now { border-color: #ffd166; } .fam small { color: var(--muted); }
  #chatBtn { position: fixed; left: 14px; bottom: calc(max(10px, env(safe-area-inset-bottom)) + 4px); width: 58px; height: 58px; border-radius: 50%;
    background: rgba(255,250,242,.95); border: 3px solid var(--ink); box-shadow: 0 4px 0 rgba(0,0,0,.28); font-size: 27px; padding: 0; z-index: 4; cursor: pointer; }
  #chatBtn i { position: absolute; top: -3px; right: -3px; width: 18px; height: 18px; border-radius: 50%; background: #ff5a5f; border: 3px solid var(--ink); display: none; }
  #pop { position: fixed; left: 17px; bottom: calc(max(10px, env(safe-area-inset-bottom)) + 74px); display: flex; flex-direction: column-reverse; gap: 8px; z-index: 4; }
  #pop button { width: 52px; height: 52px; border-radius: 50%; padding: 0; font-size: 24px; background: rgba(255,250,242,.95); border: 3px solid var(--ink); color: #2a1730;
    box-shadow: 0 3px 0 rgba(0,0,0,.25); animation: popin .18s ease backwards; }
  #pop button.txt { font-size: 15px; font-weight: 800; } #pop button.yes { background: #8fe0b4; } #pop button.no { background: #ffa3a3; }
  @keyframes popin { from { transform: translateY(20px) scale(.4); opacity: 0; } }
  #chatBtn.ping i { display: block; } #chatBtn.ping { animation: wig .6s infinite; }
  .msgs.quick { max-height: none; min-height: 0; }
  .msgs { max-height: 42vh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 4px 0 10px; }
  .m { max-width: 80%; padding: 7px 12px; border-radius: 16px; font-size: 15px; line-height: 1.3; }

function paintRing() {

  ringR = Math.max(110, Math.min(oct.r * 0.95, Math.min(VW, VH) * 0.4)) * (items.length > 7 ? 1.25 : 1);
  const [cx, cy] = ringCenter;

  const a0 = -40 * Math.PI / 180, span = 260 * Math.PI / 180;    // горе (-140°…-40°) остава свободно за балончето
  items.forEach(([id, ic, label], i) => {
    const a = a0 + (items.length > 1 ? i * span / (items.length - 1) : 0);
    const x = Math.max(36, Math.min(VW - 36, cx + Math.cos(a) * ringR));
    const y = Math.max(46, Math.min(VH - 50, cy + Math.sin(a) * ringR));
