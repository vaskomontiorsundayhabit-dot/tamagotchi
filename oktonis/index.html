<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Октонис</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Октонис">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2a2140">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #2a2140; --card: #362c52; --line: #4a3f6b; --text: #f6efe6; --muted: #b3a8cf;
    --peach: #f4a07a; --gold: #ffd166; --red: #ff6b81; --green: #6fd3a0; --blue: #7cc8f2;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: max(14px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto;
  }
  .hidden { display: none !important; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  header h1 { font-size: 20px; margin: 0; flex: 1; }
  header h1 small { color: var(--muted); font-weight: 500; font-size: 14px; margin-left: 6px; }
  .who { font-size: 13px; color: var(--muted); }
  .link { background: none; border: 0; color: var(--muted); font: inherit; font-size: 13px; text-decoration: underline; cursor: pointer; padding: 4px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 14px; }
  .scene { position: relative; padding: 0; overflow: hidden; background: #9282b4; }
  .scene canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; }
  .bubble {
    position: absolute; left: 50%; top: 6px; transform: translateX(-50%);
    background: #fffaf2; color: #2a1730; border-radius: 14px; padding: 6px 12px 7px;
    text-align: center; max-width: 80%; box-shadow: 0 3px 0 rgba(0,0,0,.25);
    transition: opacity .25s; pointer-events: none;
  }
  .bubble .e { font-size: 24px; line-height: 1.1; }
  .bubble .t { font-size: 12px; line-height: 1.25; }
  .bubble.want { border: 3px solid var(--gold); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { transform: translateX(-50%) scale(1.05); } }
  .viewer { background: #4a3f6b; color: var(--gold); text-align: center; font-size: 13px; padding: 6px; border-radius: 10px; margin-bottom: 10px; }
  .bars { display: grid; gap: 7px; }
  .bar { display: grid; grid-template-columns: 26px 1fr 34px; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .bar .ic { font-size: 17px; text-align: center; }
  .track { height: 10px; background: #1f1830; border-radius: 6px; overflow: hidden; }
  .fill { height: 100%; border-radius: 6px; transition: width .4s; }
  .bar b { color: var(--text); text-align: right; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .emojis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .emojis button { font-size: 26px; padding: 8px 0; }
  button {
    font: inherit; color: var(--text); background: #4a3f6b; border: 0; border-radius: 12px;
    padding: 10px; cursor: pointer; transition: transform .08s, background .15s;
  }
  button:active { transform: scale(.94); }
  button:disabled { opacity: .45; cursor: default; }
  h2 { font-size: 16px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: baseline; }
  h2 span { color: var(--muted); font-size: 13px; font-weight: 500; }
  .bench { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 8px; align-items: center; margin-bottom: 12px; }
  .slot {
    height: 64px; border: 2px dashed var(--line); border-radius: 14px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-size: 28px; background: #2a2140; cursor: pointer;
  }
  .slot small { font-size: 11px; color: var(--muted); }
  .slot.full { border-style: solid; border-color: var(--peach); }
  .plus { font-size: 22px; color: var(--muted); }
  .try { background: var(--peach); color: #2a1730; font-weight: 700; padding: 12px 14px; }
  .inv { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 8px; }
  .inv button { display: flex; flex-direction: column; align-items: center; padding: 8px 4px; gap: 2px; }
  .inv button span { font-size: 26px; line-height: 1.1; }
  .inv button small { font-size: 11px; color: var(--muted); line-height: 1.15; text-align: center; }
  .inv button.new { box-shadow: 0 0 0 2px var(--gold) inset; }
  .inv button.wanted { box-shadow: 0 0 0 3px var(--gold) inset; animation: wig .6s infinite; }
  @keyframes wig { 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
  .journal { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow-y: auto; }
  .journal li { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .journal li time { color: var(--muted); font-size: 12px; margin-right: 6px; }
  .login { margin-top: 8vh; text-align: center; }
  .login canvas { width: 200px; image-rendering: pixelated; }
  .login h1 { margin: 6px 0 2px; }
  .login p { color: var(--muted); margin: 0 0 18px; }
  .login form { display: grid; gap: 10px; max-width: 300px; margin: 0 auto; }
  .login input {
    font: inherit; font-size: 16px; padding: 12px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); text-align: center;
  }
  .login button { background: var(--peach); color: #2a1730; font-weight: 700; padding: 12px; }
  .err { color: var(--red); font-size: 14px; min-height: 20px; }
</style>
</head>
<body>

<div id="loginView" class="login hidden">
  <canvas id="loginOcto" width="80" height="76"></canvas>
  <h1>Октонис</h1>
  <p>малкият изобретател 🐙</p>
  <form id="loginForm">
    <input id="nick" placeholder="ник" autocomplete="username" autocapitalize="off" spellcheck="false">
    <input id="pass" type="password" placeholder="парола" autocomplete="current-password">
    <button type="submit" id="loginBtn">Влез</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<div id="loadView" class="login"><p>Зареждане… 🐙</p></div>

<div id="gameView" class="hidden">
  <header>
    <h1>🐙 Октонис <small id="level"></small></h1>
    <span class="who" id="who"></span>
    <button class="link" id="logout">изход</button>
  </header>
  <div class="viewer hidden" id="viewerNote">👀 Само гледаш. <span id="lastCare"></span></div>

  <div class="card scene">
    <canvas id="scene" width="480" height="456"></canvas>
    <div class="bubble hidden" id="bubble"><div class="e" id="bubbleE"></div><div class="t" id="bubbleT"></div></div>
  </div>

  <div class="card">
    <div class="bars" id="bars"></div>
    <div class="sub" id="status"></div>
  </div>

  <div class="card keeper">
    <h2>Кажи му нещо</h2>
    <div class="emojis" id="emojis"></div>
  </div>

  <div class="card">
    <h2>Работилница <span id="count"></span></h2>
    <div class="bench keeper">
      <div class="slot" id="slotA"><small>избери</small></div>
      <div class="plus">+</div>
      <div class="slot" id="slotB"><small>избери</small></div>
      <button class="try" id="tryBtn">Пробвай!</button>
    </div>
    <div class="inv" id="inv"></div>
  </div>

  <div class="card">
    <h2>Дневник</h2>
    <ul class="journal" id="journal"></ul>
  </div>
</div>

<script type="module">
// ---------- Firebase ----------
const firebaseConfig = {
  apiKey: "AIzaSyDOfWyvQ3jN1edYKrsTyVoDPIEqbNagQqg",
  authDomain: "oktonis.firebaseapp.com",
  projectId: "oktonis",
  storageBucket: "oktonis.firebasestorage.app",
  messagingSenderId: "136604700606",
  appId: "1:136604700606:web:ba336dfe2c9f8e8c5ab3ef"
};
const KEEPER = "toshik";                    // грижи се; останалите само гледат
const DEMO = new URLSearchParams(location.search).has("demo");

let fb = null;
if (!DEMO) {
  const V = "10.12.2", G = `https://www.gstatic.com/firebasejs/${V}/`;
  let mods;
  try {
    mods = await Promise.all([import(G + "firebase-app.js"), import(G + "firebase-auth.js"), import(G + "firebase-firestore.js")]);
  } catch (e) {
    document.getElementById("loadView").innerHTML = "<p>Няма връзка с интернет 📡<br>Опитай пак след малко.</p>";
    throw e;
  }
  const [appM, authM, fsM] = mods;
  const app = appM.initializeApp(firebaseConfig);
  fb = { auth: authM.getAuth(app), db: fsM.getFirestore(app), A: authM, F: fsM };
}

// ---------- Изобретения ----------
const E = {
  tok: ["⚡", "Ток"], metal: ["🔩", "Метал"], voda: ["💧", "Вода"], ogan: ["🔥", "Огън"], vazduh: ["💨", "Въздух"],
  zica: ["🔌", "Жица"], gear: ["⚙️", "Зъбно колело"], para: ["♨️", "Пара"], verig: ["🔗", "Верига"], perka: ["🌀", "Перка"],
  bat: ["🔋", "Батерия"], magnit: ["🧲", "Магнит"], kruska: ["💡", "Крушка"], vzriv: ["💥", "Взрив"], oblak: ["☁️", "Облак"],
  burq: ["🌩️", "Буря"], vent: ["🌬️", "Вентилатор"], parna: ["🚂", "Парна машина"], chas: ["⏰", "Часовник"], kompas: ["🧭", "Компас"],
  fener: ["🔦", "Фенерче"], antena: ["📡", "Антена"], radio: ["📻", "Радио"], tv: ["📺", "Телевизор"], chip: ["💾", "Чип"],
  tel: ["📱", "Телефон"], komp: ["💻", "Компютър"], net: ["🌐", "Интернет"], ruka: ["🦾", "Робо-ръка"], robot: ["🤖", "Робот"],
  dron: ["🚁", "Дрон"], kolelo: ["🚲", "Колело"], kola: ["🚗", "Кола"], raketa: ["🚀", "Ракета"], satelit: ["🛰️", "Сателит"],
  led: ["🧊", "Лед"], muz: ["🎶", "Музикална кутия"], printer: ["🖨️", "Принтер"], konzola: ["🕹️", "Конзола"], gram: ["🗼", "Гръмоотвод"],
  svetof: ["🚦", "Светофар"], kamera: ["📷", "Фотоапарат"], chat: ["💬", "Чат"], um: ["🧠", "Изкуствен ум"], robokt: ["🐙", "Робо-Октонис"],
};
const BASE = ["tok", "metal", "voda", "ogan", "vazduh"];
const RECIPES = [
  ["tok", "metal", "zica"], ["zica", "metal", "magnit"], ["zica", "ogan", "kruska"], ["tok", "tok", "bat"],
  ["ogan", "voda", "para"], ["ogan", "metal", "gear"], ["metal", "metal", "verig"], ["vazduh", "metal", "perka"],
  ["ogan", "vazduh", "vzriv"], ["voda", "vazduh", "oblak"], ["oblak", "tok", "burq"], ["perka", "tok", "vent"],
  ["para", "gear", "parna"], ["gear", "gear", "chas"], ["magnit", "voda", "kompas"], ["kruska", "bat", "fener"],
  ["zica", "zica", "antena"], ["antena", "tok", "radio"], ["radio", "kruska", "tv"], ["zica", "chas", "chip"],
  ["radio", "chip", "tel"], ["chip", "tv", "komp"], ["komp", "antena", "net"], ["chip", "metal", "ruka"],
  ["ruka", "bat", "robot"], ["perka", "chip", "dron"], ["verig", "gear", "kolelo"], ["kolelo", "parna", "kola"],
  ["kola", "vzriv", "raketa"], ["raketa", "antena", "satelit"], ["voda", "vent", "led"], ["chas", "radio", "muz"],
  ["komp", "ruka", "printer"], ["komp", "tv", "konzola"], ["burq", "verig", "gram"], ["kruska", "chas", "svetof"],
  ["tel", "kruska", "kamera"], ["tel", "net", "chat"], ["robot", "komp", "um"], ["robot", "voda", "robokt"],
];
const key = (a, b) => [a, b].sort().join("+");
const RECIPE = Object.fromEntries(RECIPES.map(([a, b, c]) => [key(a, b), c]));
const name = id => E[id][0] + " " + E[id][1];

// ---------- Състояние ----------
const MIN = 60000;
let S = null;              // състоянието на Октонис
let role = "keeper";       // keeper | viewer
let session = Math.random().toString(36).slice(2);
let dirty = false, lastSave = 0;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));

function fresh(now) {
  return {
    v: 1, t: now, born: now, hunger: 20, energy: 85, mood: 70, health: 100, mess: 0, skill: 0,
    asleep: false, hurt: 0, known: [...BASE], fresh: [], want: null, nextWant: now + 2 * MIN,
    lastHint: 0, lastWin: 0, lastCare: now, journal: [{ t: now, x: "🥚 Октонис се излюпи! Обича технологиите." }],
  };
}
function log(x, t = Date.now()) {
  S.journal.unshift({ t, x });
  S.journal.length = Math.min(S.journal.length, 60);
}
function candidates() {
  return RECIPES.filter(([a, b, c]) => S.known.includes(a) && S.known.includes(b) && !S.known.includes(c));
}
function discover(id) {
  if (S.known.includes(id)) return;
  S.known.push(id);
  S.fresh = [...(S.fresh || []), id].slice(-6);
}
function night(t) { const h = new Date(t).getHours(); return h >= 22 || h < 7; }

// Една минута от живота му. offline = докато никой не гледа.
function minute(t, offline, ev) {
  if (S.asleep) {
    S.energy = clamp(S.energy + 1.2);
    if (S.energy >= 100 && !night(t)) { S.asleep = false; log("☀️ Събуди се бодър.", t); }
    else if (S.energy >= 100 && Math.random() < 0.02) { S.asleep = false; log("☀️ Събуди се.", t); }
  } else {
    S.energy = clamp(S.energy - (night(t) ? 0.25 : 1 / 6));
    if (S.energy <= 8) { S.asleep = true; log("😴 Заспа от умора.", t); }
  }
  S.hunger = clamp(S.hunger + (S.asleep ? 1 / 14 : 1 / 8));
  if (S.hunger >= 95) S.health = clamp(S.health - 0.1);
  else if (S.hunger < 70) S.health = clamp(S.health + (S.hurt ? 0.03 : 0.1));
  if (S.hurt && S.health >= 95) S.hurt = 0;
  let target = 65 - (S.hunger > 70 ? 20 : 0) - (S.hurt ? 15 : 0) - (S.mess > 70 ? 15 : 0) - (S.health < 40 ? 15 : 0);
  S.mood = clamp(S.mood + Math.sign(target - S.mood) * 0.1);

  if (offline && !S.asleep && S.energy > 30 && ev.n < 3 && Math.random() < 1 / 180) {
    ev.n++;
    const c = candidates();
    if (c.length && Math.random() < 0.35) {
      const r = pick(c)[2]; discover(r); S.skill += 0.4; S.mood = clamp(S.mood + 15);
      log(`🎉 Докато те нямаше, сам изобрети ${name(r)}!`, t);
    } else {
      S.hurt = 1; S.health = clamp(S.health - 8); S.skill += 0.5; S.mess = clamp(S.mess + 10);
      log(pick(["🤕 Докато те нямаше, опита нещо и се удари.", "🤕 Сам си майстори нещо и се опари.", "🤕 Опита сам, но винтчето отхвърча."]), t);
    }
  }
}
function catchUp(now) {
  const offline = role === "keeper" && now - S.t > 3 * MIN;
  const ev = { n: 0 };
  let steps = 0;
  if (now - S.t > 14 * 24 * 60 * MIN) S.t = now - 14 * 24 * 60 * MIN;
  while (S.t + MIN <= now) { minute(S.t + MIN, offline, ev); S.t += MIN; steps++; }
  if (steps) dirty = true;
  return steps;
}

// ---------- Говорене ----------
let bubbleUntil = 0;
function say(e, t = "", ms = 4500) {
  bubbleUntil = performance.now() + ms;
  showBubble(e, t, false);
}
function showBubble(e, t, want) {
  const b = $("bubble");
  $("bubbleE").textContent = e; $("bubbleT").textContent = t;
  b.classList.toggle("want", want); b.classList.remove("hidden");
}
function updateBubble() {
  if (performance.now() < bubbleUntil) return;
  if (S.want && !S.asleep) {
    const w = S.want;
    const txt = { food: "Гладен съм…", heal: "Боли ме… имаш ли лепенка?", tidy: "Тук е бъркотия!", hug: "Тъжно ми е…", love: "Обичаш ли ме?",
      item: `Трябва ми ${E[w.id]?.[1] || ""} за проекта!` }[w.k];
    showBubble(w.e + " ?", txt, true);
  } else if (S.asleep) showBubble("💤", "", false);
  else $("bubble").classList.add("hidden");
}
const CHATTER = [
  ["🧐", "Проверявам винтчетата… пак."], ["📋", "Правя списък на списъците."], ["🧽", "Тук има прашинка!"],
  ["📐", "Всичко трябва да е под прав ъгъл."], ["🤓", "Обичам технологиите!"], ["🔧", "Мисля, мисля…"],
  ["🗂️", "Подредих болтовете по размер."], ["🔬", "Това трябва да се изследва."],
];
function chatter() {
  if (role !== "keeper" || S.asleep || S.want || performance.now() < bubbleUntil + 30000) return;
  if (Math.random() > 0.3) return;
  if (S.mess > 50) return say("😖", "Каква бъркотия…");
  const c = candidates();
  if (c.length && Math.random() < 0.25) { const [a, b] = pick(c); return say("💭", `Чудя се какво става от ${E[a][0]} и ${E[b][0]}…`); }
  say(...pick(CHATTER));
}

// ---------- Желания ----------
function wants(now) {
  if (role !== "keeper" || S.asleep) return;
  if (S.want && now - S.want.t > 10 * MIN) {
    S.want = null; S.mood = clamp(S.mood - 5); dirty = true; say("😞", "Няма значение…");
    S.nextWant = now + rnd(3, 6) * MIN;
  }
  if (S.want || now < S.nextWant) return;
  let w;
  if (S.hurt) w = { e: "🩹", k: "heal" };
  else if (S.hunger > 60) w = { e: "🍕", k: "food" };
  else if (S.mess > 60) w = { e: "🧹", k: "tidy" };
  else if (S.mood < 40) w = { e: "🤗", k: "hug" };
  else if (Math.random() < 0.6) { const id = pick(S.known); w = { e: E[id][0], k: "item", id }; }
  else w = { e: "❤️", k: "love" };
  S.want = { ...w, t: now }; dirty = true;
  bubbleUntil = 0;
  renderInv();
}
function fulfil(now) {
  S.want = null; S.mood = clamp(S.mood + 12); S.skill += 0.1;
  S.nextWant = now + rnd(3, 7) * MIN;
  say("😍", "Точно това исках! Благодаря!");
}

// ---------- Емотикони ----------
const EMOJIS = ["🍕", "🩹", "🧹", "😴", "☀️", "❤️", "👍", "😂", "🤗", "🎉", "💡", "👋"];
function sendEmoji(e) {
  if (role !== "keeper") return;
  const now = Date.now();
  S.lastCare = now; dirty = true;
  if (S.want && S.want.k !== "item" && S.want.e === e) {
    act(e, now, true);
    log(`${e} Даде му каквото искаше.`);
    fulfil(now); return save();
  }
  act(e, now, false);
  save();
}
function act(e, now, wanted) {
  if (S.asleep && e !== "☀️" && e !== "❤️") return say("💤", "Шшш… спи.");
  switch (e) {
    case "🍕":
      if (S.hunger < 15) { S.mood = clamp(S.mood - 2); return say("🤢", "Пълен съм!"); }
      S.hunger = clamp(S.hunger - 45); S.mood = clamp(S.mood + 3); return say("😋", "Ммм, пица!");
    case "🩹":
      if (!S.hurt && S.health >= 80) return say("🤔", "Нищо ми няма.");
      S.hurt = 0; S.health = clamp(S.health + 20); S.mood = clamp(S.mood + 5); return say("🥹", "Така е много по-добре.");
    case "🧹":
      if (S.mess < 10) return say("👌", "Вече е подредено.");
      S.mess = 0; S.mood = clamp(S.mood + 8); return say("✨", "Подредено! Обичам ред.");
    case "😴":
      if (S.energy > 60) return say("😤", "Не съм уморен, работя!");
      S.asleep = true; S.want = null; log("😴 Легна да спи."); return say("😴", "Лека нощ…");
    case "☀️":
      if (!S.asleep) return say("😎", "Буден съм!");
      if (S.energy < 30) return say("😪", "Още малко…");
      S.asleep = false; log("☀️ Събуди го."); return say("🥱", "Добро утро!");
    case "❤️": S.mood = clamp(S.mood + 6); return say(S.asleep ? "💤💗" : "🥰", "");
    case "👍": S.mood = clamp(S.mood + 3); return say("😊", "");

const W = 80, H = 76;
const off = document.createElement("canvas"); off.width = W; off.height = H;
const g = off.getContext("2d");
const C = { out: "#2a1730", body: "#f4a07a", back: "#e08a62", light: "#fbc6a4", shade: "#d97a55", eye: "#ffffff",

function tentacles(t, hx, hy, mode, front) {
  const speed = mode === "party" ? 7 : mode === "sleep" ? 0.8 : mode === "work" ? 4 : 2.2;

  const list = [];

  for (const pts of back) for (const [x, y, r] of pts) disc(x, y, r + 1, C.out);

    if (mode === "party") { px(x, ey + 2, C.out); px(x + 1, ey + 1, C.out); px(x + 2, ey + 1, C.out); px(x + 3, ey + 2, C.out); return; }

    rect(x, ey, 4, 5, C.eye);
    const py = mode === "sad" ? 1 : 0;
    rect(x + 1 + look[0], ey + 1 + look[1] + py, 2, 3 - py, C.out);
    px(x + 2 + look[0], ey + 1 + look[1] + py, "#8a7aa8");
    if (mode === "sad") { px(x - 1, ey - 2 + (x < ex ? 1 : 0), C.out); px(x + 4, ey - 2 + (x < ex ? 0 : 1), C.out); }

  const my = ey + 7;
  if (mode === "party") { rect(ex - 2, my, 4, 2, C.out); rect(ex - 1, my + 1, 2, 1, C.pink); }
  else if (mode === "sleep") { px(ex, my, C.out); }
  else if (mode === "sad" || hurtNow) { rect(ex - 1, my, 2, 1, C.out); px(ex - 2, my + 1, C.out); px(ex + 1, my + 1, C.out); }
  else if (mode === "happy") { px(ex - 2, my, C.out); rect(ex - 1, my + 1, 2, 1, C.out); px(ex + 1, my, C.out); }
  else if (mode === "work") { rect(ex - 1, my, 2, 1, C.out); px(ex + 1, my + 1, C.pink); }

  requestAnimationFrame(loginLoop);
  const t = performance.now() / 1000;
  bg(t); drawOcto(t, "happy");
  const lc = $("loginOcto").getContext("2d");
  lc.drawImage(off, 0, 0);
}
window.__octoIcon = (size) => {   // за иконката
  rect(0, 0, W, H, C.bgA);
  for (let y = 0; y < H; y++) rect(0, y, W, 1, C.bgA);
  drawOcto(1.3, "happy");
  const c = document.createElement("canvas"); c.width = c.height = size;
  const x = c.getContext("2d"); x.imageSmoothingEnabled = false;
  x.fillStyle = C.bgA; x.fillRect(0, 0, size, size);
  const s = size / 64;
  x.drawImage(off, 6, 8, 68, 68, 0, 0, size, size);
  return c.toDataURL("image/png");
};

// ---------- Таймер ----------
let lastMinuteCheck = 0;
setInterval(() => {
  if (!S) return;
  const now = Date.now();
  if (role === "keeper") {
    if (catchUp(now)) render();
    wants(now);
    if (frameSec++ % 45 === 0) chatter();
    if (dirty && now - lastSave > 60000) save();
  } else if (viewBase && now - lastMinuteCheck > 20000) {
    lastMinuteCheck = now;
    S = JSON.parse(viewBase); catchUp(now); render();
  }
  updateBubble();
}, 1000);
let frameSec = 1;
document.addEventListener("visibilitychange", () => { if (document.hidden) save(true); });
window.addEventListener("pagehide", () => save(true));

// ---------- Вход ----------
function startAs(nick) {
  role = nick === KEEPER ? "keeper" : "viewer";
  $("who").textContent = nick;
  show("loadView");
  load();
}
$("loginForm").onsubmit = async ev => {
  ev.preventDefault();
  const nick = $("nick").value.trim().toLowerCase(), pass = $("pass").value;
  if (!nick || !pass) return;
  $("loginErr").textContent = ""; $("loginBtn").disabled = true;
  try {
    await fb.A.signInWithEmailAndPassword(fb.auth, nick + "@oktonis.app", pass);
  } catch (e) {
    $("loginErr").textContent = "Грешен ник или парола 🙈";
  }
  $("loginBtn").disabled = false;
};
$("logout").onclick = async () => {
  await save(true);
  if (unsub) unsub();
  S = null; viewBase = null;
  if (DEMO) { show("loginView"); return; }
  await fb.A.signOut(fb.auth);
};
requestAnimationFrame(loop);
if (DEMO) {
  startAs(new URLSearchParams(location.search).get("demo") || KEEPER);
} else {
  fb.A.onAuthStateChanged(fb.auth, user => {
    if (user) startAs(user.email.split("@")[0]);
    else { S = null; show("loginView"); loginLoop(); }
  });
}
</script>
