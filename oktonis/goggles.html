<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Октонис: проба на дизайна</title>
<style>
  :root { --bg: #2a2140; --line: #4a3f6b; --text: #f6efe6; --muted: #b3a8cf; --peach: #f4a07a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  p { color: var(--muted); margin: 0 0 12px; font-size: 14px; }
  h2 { font-size: 14px; color: var(--muted); font-weight: 600; margin: 14px 0 6px; }
  .scene { border-radius: 18px; overflow: hidden; border: 1px solid var(--line); }
  canvas { display: block; width: 100%; height: auto; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .row.m { grid-template-columns: repeat(3, 1fr); }
  button { font: inherit; font-size: 14px; color: var(--text); background: #4a3f6b; border: 0; border-radius: 12px; padding: 9px 4px; cursor: pointer; }
  button.on { background: var(--peach); color: #2a1730; font-weight: 700; }
</style>
</head>
<body>
<h1>🐙 Октонис: проба на дизайна</h1>
<p>Избери възраст и настроение.</p>
<div class="scene"><canvas id="c"></canvas></div>
<h2>Възраст</h2>
<div class="row" id="ages"></div>
<h2>Настроение</h2>
<div class="row m" id="modes"></div>
<script src="octo.js"></script>
<script>
const MODES = [["idle", "😐 Обикновен"], ["happy", "😊 Щастлив"], ["party", "🎉 Получи се!"],
  ["work", "🔧 Изобретява"], ["hurt", "🤕 Контузен"], ["sleep", "😴 Спи"]];
const AGE_ICON = { egg: "🥚", baby: "🍼", kid: "🧒", teen: "🛹", adult: "🧑‍🔬", aging: "🧓", old: "👴" };
let mode = "idle", age = "adult", modeAt = 0;
const st = {};
function buttons(boxId, list, get, set) {
  const box = document.getElementById(boxId);
  const paint = () => { for (const b of box.children) b.classList.toggle("on", b.dataset.v === get()); };
  for (const [v, label] of list) {
    const b = document.createElement("button"); b.textContent = label; b.dataset.v = v;
    b.onclick = () => { set(v); paint(); }; box.appendChild(b);
  }
  paint();
}
buttons("ages", Octo.AGES.map(a => [a, AGE_ICON[a] + " " + Octo.AGE_NAMES[a]]), () => age, v => age = v);
buttons("modes", MODES, () => mode, v => { mode = v; modeAt = performance.now() / 1000; });

const cv = document.getElementById("c"), g = cv.getContext("2d");
const LW = 600, LH = 560;
const d = Math.min(window.devicePixelRatio || 1, 2);
cv.width = LW * d; cv.height = LH * d;
function frame() {
  requestAnimationFrame(frame);
  const t = performance.now() / 1000;
  g.setTransform(d, 0, 0, d, 0, 0);
  g.fillStyle = "#f7f3ec"; g.fillRect(0, 0, LW, LH);
  g.fillStyle = "#ece5f4"; g.beginPath(); g.ellipse(LW / 2, LH * 0.45, LW * 0.42, LH * 0.38, 0, 0, Math.PI * 2); g.fill();
  Octo.draw(g, { x: LW / 2, y: 290, s: 0.95, age, mode, t, mt: t - modeAt, st, ground: LH - 70 });
  if (mode === "sleep") { g.fillStyle = "rgba(40,30,90,.25)"; g.fillRect(0, 0, LW, LH); }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
