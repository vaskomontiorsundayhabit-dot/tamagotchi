<title>Родословие 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: горе родословието на избрания предмет (дърво надолу към нещата от дъното), долу всички поколения като рафтове за избор */
:root {
  --bg: #eef5f4; --paper: #ffffff; --ink: #18323a; --muted: #5a7279; --line: #c9dcdb; --sea: #1f7a8c; --sand: #f3d9a4; --coral: #e8664f; --gold: #d99a1e; --blue: #2f86c9;
  --display: "Fredoka", "Nunito", system-ui, sans-serif; --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0d1d22; --paper: #13282e; --ink: #e3eff0; --muted: #93abb0; --line: #2a4a53; --sea: #5cc3d4; --sand: #6b5426; --coral: #ff8a73; --gold: #f2b84b; --blue: #6db7f0; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #0d1d22; --paper: #13282e; --ink: #e3eff0; --muted: #93abb0; --line: #2a4a53; --sea: #5cc3d4; --sand: #6b5426; --coral: #ff8a73; --gold: #f2b84b; --blue: #6db7f0; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); }
.wrap { max-width: 1100px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 26px 60px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: clamp(28px, 6vw, 42px); color: var(--sea); }
h2 { font-size: 22px; } p { margin: 0; max-width: 70ch; } .muted { color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 13.5px; color: var(--muted); }
.legend b { color: var(--ink); }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: -1px; margin-right: 4px; border: 2px solid; }
section { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; min-width: 0; }
.im { width: 34px; height: 34px; display: block; background: var(--sand) center / 90% no-repeat; border-radius: 9px; flex: none; }
/* родословието */
.ped { overflow-x: auto; padding: 12px 8px 6px; }
.tree, .tree ul { display: flex; justify-content: center; margin: 0; padding: 0; }
.tree ul { padding-top: 18px; position: relative; }
.tree li { list-style: none; position: relative; padding: 18px 4px 0; display: flex; flex-direction: column; align-items: center; }
.tree > li { padding-top: 0; }
.tree li::before, .tree li::after { content: ""; position: absolute; top: 0; right: 50%; width: 50%; height: 18px; border-top: 2px solid var(--line); }
.tree li::after { right: auto; left: 50%; border-left: 2px solid var(--line); }
.tree li:only-child::before, .tree li:only-child::after { display: none; }
.tree li:only-child { padding-top: 0; }
.tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
.tree li:last-child::before { border-right: 2px solid var(--line); border-radius: 0 8px 0 0; }
.tree li:first-child::after { border-radius: 8px 0 0 0; }
.tree ul::before { content: ""; position: absolute; top: 0; left: 50%; height: 18px; border-left: 2px solid var(--line); }
.tree > li::before, .tree > li::after { display: none; }
.node { display: grid; justify-items: center; gap: 2px; width: 82px; padding: 6px 4px; border: 2px solid var(--line); background: var(--paper); border-radius: 12px; cursor: pointer; font: 600 11.5px/1.15 var(--body); color: var(--ink); position: relative; }
.node:hover { border-color: var(--sea); }
.node.root { border-color: var(--coral); width: 110px; font-size: 13px; }
.node.root .im { width: 52px; height: 52px; }
.node .how { position: absolute; top: -10px; right: -8px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; font-size: 12px; padding: 0 4px; }
.leafnote { font-size: 11.5px; color: var(--muted); max-width: 110px; text-align: center; padding-top: 4px; }
.info { display: grid; gap: 6px; }
.info .kids { display: flex; flex-wrap: wrap; gap: 6px; }
/* поколенията */
.gen { display: grid; gap: 8px; }
.gen h3 { font-size: 15px; color: var(--muted); font-weight: 600; letter-spacing: .03em; }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
.ch { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 3px; border: 2px solid var(--line); border-radius: 999px; background: var(--paper); color: var(--ink); font: 600 13px var(--body); cursor: pointer; }
.ch .im { width: 26px; height: 26px; border-radius: 999px; }
.ch.anc { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 14%, var(--paper)); }
.ch.des { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 12%, var(--paper)); }
.ch.sel { border-color: var(--coral); background: color-mix(in srgb, var(--coral) 18%, var(--paper)); }
.dim .ch:not(.anc):not(.des):not(.sel) { opacity: .45; }
button:focus-visible { outline: 3px solid var(--sea); outline-offset: 2px; }
input#q { font: 16px var(--body); padding: 9px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; box-sizing: border-box; }
.sticky { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
@media (prefers-reduced-motion: no-preference) { .node, .ch { transition: border-color .15s, opacity .15s; } }
.im.emo { display: grid; place-items: center; font-style: normal; font-size: 20px; } .node.root .im.emo { font-size: 30px; }
.gen h3 .lv { display: inline-block; font: 700 11px var(--body); background: var(--line); border-radius: 999px; padding: 1px 8px; margin-left: 6px; }
{{CSS}}
</style>
<div class="wrap">
  <header style="display:grid;gap:8px">
    <h1>Родословие 2</h1>
    <p class="muted">Новата система: нещата от дъното, всички начини и рецепти. Докосни предмет и ще видиш от какво е направен, чак до дъното, и какво става от него.</p>
    <div class="legend"><span><b>⚗️</b> смесено</span><span><b>🔥</b> загрято</span><span><b>❄️</b> охладено</span><span><b>🔧</b> разглобено</span><span><b>⏳</b> с времето</span>
      <span><i class="sw" style="border-color:var(--gold)"></i>предци</span><span><i class="sw" style="border-color:var(--blue)"></i>потомци</span></div>
  </header>
  <section>
    <h2 id="pt"></h2>
    <div class="info" id="info"></div>
    <div class="ped" id="ped"></div>
  </section>
  <section>
    <h2>Всички поколения: от най-трудните до базовите</h2>
    <input id="q" type="search" placeholder="Търси предмет…" aria-label="Търси предмет">
    <div id="gens" style="display:grid;gap:16px"></div>
  </section>
</div>
<script>
const D = {{DATA}};
const HOW = { mix: "⚗️", heat: "🔥", cool: "❄️", apart: "🔧", time: "⏳" };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const im = k => D[k].em ? `<i class="im emo">${D[k].em}</i>` : `<i class="im i-${k}"></i>`;
const chip = k => `<button class="ch" data-k="${k}">${im(k)}${esc(D[k].n)}</button>`;
function node(k, root, lvl) {
  const x = D[k], r = x.p[0];
  let h = `<li><button class="node${root ? " root" : ""}" data-k="${k}">${r ? `<span class="how">${HOW[r[0]]}</span>` : ""}${im(k)}<span>${esc(x.n)}</span></button>`;
  if (r && lvl < 7) h += `<ul>${r[1].map(c => node(c, false, lvl + 1)).join("")}</ul>`;
  else if (x.base) h += `<div class="leafnote">от дъното</div>`;
  return h + "</li>";
}
function anc(k, s = new Set()) { for (const r of D[k].p.slice(0, 1)) for (const c of r[1]) if (!s.has(c)) { s.add(c); anc(c, s); } return s; }
function des(k, s = new Set()) { for (const c of D[k].c) if (!s.has(c)) { s.add(c); des(c, s); } return s; }
function select(k) {
  const x = D[k];
  document.getElementById("pt").textContent = `Родословието на „${x.n}“`;
  const other = x.p.slice(1).map(r => `${HOW[r[0]]} ${r[1].map(c => esc(D[c].n)).join(" + ")}`);
  document.getElementById("info").innerHTML = (x.base ? `<p class="muted">Пада на дъното (${esc(x.cat)}).</p>` : `<p class="muted">Поколение ${x.d}.</p>`) +
    (other.length ? `<p class="muted">Може и така: ${other.join("; ")}</p>` : "") +
    (x.c.length ? `<p><b>От него стават:</b></p><div class="kids">${x.c.map(chip).join("")}</div>` : `<p class="muted">От него не става нищо друго тук.</p>`);
  document.getElementById("ped").innerHTML = `<ul class="tree">${node(k, true, 0)}</ul>`;
  const A = anc(k), Ds = des(k);
  document.querySelectorAll("#gens .ch").forEach(b => { const q = b.dataset.k; b.classList.toggle("sel", q === k); b.classList.toggle("anc", A.has(q)); b.classList.toggle("des", Ds.has(q)); });
  document.getElementById("gens").classList.add("dim");
  const ped = document.getElementById("ped"); ped.scrollLeft = (ped.scrollWidth - ped.clientWidth) / 2;
}
const keys = Object.keys(D), maxD = Math.max(...keys.map(k => D[k].d).filter(d => d < 99));
const by = (f) => keys.filter(f).sort((a, b) => D[a].n.localeCompare(D[b].n, "bg"));
const LV = ["", "лесни", "лесни", "средни", "трудни", "много трудни", "най-трудните", "най-трудните"];
let g = "";
for (let i = maxD; i >= 1; i--) { const l = by(k => D[k].d === i); if (l.length) g += `<div class="gen"><h3>Поколение ${i}<span class="lv">${LV[Math.min(i, 7)]}</span></h3><div class="row">${l.map(chip).join("")}</div></div>`; }
const cats = [...new Set(keys.filter(k => D[k].base).map(k => D[k].cat))];
for (const c of cats) g += `<div class="gen"><h3>От дъното: ${esc(c)}<span class="lv">базови</span></h3><div class="row">${by(k => D[k].base && D[k].cat === c).map(chip).join("")}</div></div>`;
document.getElementById("gens").innerHTML = g;
document.addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (!b) return; select(b.dataset.k); if (b.closest("#gens") || b.closest("#info")) document.getElementById("pt").scrollIntoView({ behavior: "smooth", block: "start" }); });
const q = document.getElementById("q");
q.addEventListener("input", () => { const v = q.value.trim().toLowerCase(); document.querySelectorAll("#gens .ch").forEach(b => b.hidden = v && !D[b.dataset.k].n.toLowerCase().includes(v)); });
select(keys.filter(k => D[k].d < 99).sort((a, b) => D[b].d - D[a].d)[0]);
</script>
