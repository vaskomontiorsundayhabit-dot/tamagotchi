# Всяко качване в main сглобява приложението и пуска нова версия (Release).
# Приложението само проверява за нея и се обновява.
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: BUILD_NUMBER=${{ github.run_number }} ./build.sh universal
      - env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          gh release create "v${{ github.run_number }}" build/Tamagotchi.zip \
            --title "Версия ${{ github.run_number }}" --notes "${NOTES:-Нова версия}"
